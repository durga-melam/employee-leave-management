spring.application.name=employee-leave-management

# ===============================================
# MySQL Database Configuration
# ===============================================
# Sensitive credentials are not hardcoded. Set them via environment variables:
# e.g., in PowerShell: $env:SPRING_DATASOURCE_PASSWORD="your_password"
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_leave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# Spring Data JPA / Hibernate Configuration
# ===============================================
# 'update' safely adjusts schema without dropping existing tables or data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
